apiVersion: rhdh.redhat.com/v1alpha4
kind: Backstage
metadata:
  name: developer-hub-azure
  annotations:
    # Sync after PostgreSQL is in place.
    argocd.argoproj.io/sync-wave: "2"
spec:
  deployment:
    patch:
      spec:
        template:
          spec:
            # Identity for the Kubernetes plugin (base/rhdh/kubernetes-rbac.yaml).
            # The operator defaults automountServiceAccountToken to false, which
            # leaves the pod without the token and CA the plugin reads.
            serviceAccountName: rhdh-kubernetes
            automountServiceAccountToken: true
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rhdh-app-config
    dynamicPluginsConfigMapName: rhdh-dynamic-plugins
    extraEnvs:
      envs:
        # The Kubernetes plugin talks to the kube-apiserver over the internal
        # service network, where the serving certificate is issued by the
        # cluster's own CA. Node only trusts its built-in public CA bundle, so
        # without this the plugin fails with
        #   FETCH_ERROR ... self-signed certificate in certificate chain
        # This adds the cluster CA (same bundle the ServiceAccount mount
        # provides) to Node's trust store for the whole backend process, so
        # certificates stay verified rather than skipped.
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      secrets:
        # BACKEND_SECRET, AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
        - name: rhdh-azure-secrets
        # POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD
        - name: rhdh-postgres-secret
    route:
      enabled: true
      host: rhdhazure.apps.ocprod.303.tube # replaced by the overlay
      # Operator creates an edge-terminated Route using the cluster's default
      # ingress certificate. To use your own cert, set
      # tls.externalCertificateSecretName (or tls.certificate/key).
  database:
    # Use the dedicated PostgreSQL in this directory instead of the
    # operator-managed one.
    enableLocalDb: false
