includes:
  - dynamic-plugins.default.yaml

plugins:
  # Imports Entra ID users and groups into the catalog so that signed-in
  # users resolve to a User entity (required for sign-in and RBAC).
  # Connection settings live in app-config (catalog.providers.microsoftGraphOrg).
  - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-msgraph-dynamic
    disabled: false

  # ---------------------------------------------------------------------------
  # Kubernetes
  # Both packages ship preinstalled in the RHDH image (and are listed, disabled,
  # in dynamic-plugins.default.yaml), so the local dist path is enough -- no OCI
  # artifact needed. Cluster connection settings live in app-config
  # (kubernetes.clusterLocatorMethods).
  # ---------------------------------------------------------------------------

  # Reads workloads from the cluster for the entity Kubernetes tab.
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
    disabled: false

  # Kubernetes tab on entity pages. The tab itself is already part of the RHDH
  # entity page; it only renders once something is mounted into its cards slot.
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage.plugin-kubernetes:
            mountPoints:
              - mountPoint: entity.page.kubernetes/cards
                importName: EntityKubernetesContent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      # Entity needs backstage.io/kubernetes-id (or
                      # backstage.io/kubernetes-namespace / -label-selector).
                      - isKubernetesAvailable

  # ---------------------------------------------------------------------------
  # Azure DevOps
  # Plain npm package names (e.g. @backstage-community/plugin-azure-devops) do
  # not work here: they are not dynamic-plugin builds and the installer rejects
  # them without an integrity hash. Use the OCI artifacts that RHDH's plugin
  # catalog index lists for this release (Backstage 1.49.4).
  # ---------------------------------------------------------------------------

  # Scaffolder actions: azure:pipeline:create / permit / run
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-scaffolder-backend-module-azure-devops:bs_1.49.4__0.23.0!backstage-community-plugin-scaffolder-backend-module-azure-devops
    disabled: false

  # Scaffolder action: publish:azure (used by the dotnet-api-azure-devops template)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-scaffolder-backend-module-azure:bs_1.49.4__0.2.19!backstage-plugin-scaffolder-backend-module-azure
    disabled: false

  # Azure DevOps backend (pipelines, pull requests, README data for the frontend)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-azure-devops-backend:bs_1.49.4__0.27.0!backstage-community-plugin-azure-devops-backend
    disabled: false

  # Azure DevOps frontend: CI and Pull Requests tabs on entity pages
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-azure-devops:bs_1.49.4__0.29.0!backstage-community-plugin-azure-devops
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-azure-devops:
            mountPoints:
              - mountPoint: entity.page.ci/cards
                importName: EntityAzurePipelinesContent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isAzureDevOpsAvailable
              - mountPoint: entity.page.pull-requests/cards
                importName: EntityAzurePullRequestsContent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    allOf:
                      - isAzureDevOpsAvailable
