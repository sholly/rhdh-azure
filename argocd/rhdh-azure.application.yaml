apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhdh-azure
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/sholly/rhdh-azure.git
    targetRevision: main
    path: overlays/ocprod
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-azure
  # The Deployment/Route/Service generated by the operator are owned by the
  # Backstage CR, so ArgoCD shows them in the tree but never prunes them.
  ignoreDifferences:
    - group: rhdh.redhat.com
      kind: Backstage
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
