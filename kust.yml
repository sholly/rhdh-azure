apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
  name: rhdh-azure
---
apiVersion: v1
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://rhdhazure.apps.ocprod.303.tube

    backend:
      baseUrl: https://rhdhazure.apps.ocprod.303.tube
      cors:
        origin: https://rhdhazure.apps.ocprod.303.tube
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: ${BACKEND_SECRET}
      # Dedicated PostgreSQL (base/postgres). Values come from rhdh-postgres-secret.
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}

    # ---------------------------------------------------------------------------
    # Microsoft Entra ID sign-in
    # Redirect URI to register on the Entra app registration:
    #   https://rhdhazure.apps.ocprod.303.tube/api/auth/microsoft/handler/frame
    # ---------------------------------------------------------------------------
    signInPage: microsoft

    auth:
      environment: production
      providers:
        microsoft:
          production:
            clientId: ${AZURE_CLIENT_ID}
            clientSecret: ${AZURE_CLIENT_SECRET}
            tenantId: ${AZURE_TENANT_ID}
            domainHint: ${AZURE_TENANT_ID}
            signIn:
              resolvers:
                # Tried in order until one matches a User entity from MS Graph.
                - resolver: userIdMatchingUserEntityAnnotation
                - resolver: emailMatchingUserEntityProfileEmail
                - resolver: emailLocalPartMatchingUserEntityName

    # ---------------------------------------------------------------------------
    # Entra ID users & groups -> catalog (msgraph dynamic plugin)
    # Requires Application permissions on the same app registration:
    #   User.Read.All, GroupMember.Read.All (admin consent granted)
    # ---------------------------------------------------------------------------
    catalog:
      providers:
        microsoftGraphOrg:
          default:
            target: https://graph.microsoft.com/v1.0
            authority: https://login.microsoftonline.com
            tenantId: ${AZURE_TENANT_ID}
            clientId: ${AZURE_CLIENT_ID}
            clientSecret: ${AZURE_CLIENT_SECRET}
            user:
              filter: accountEnabled eq true and userType eq 'Member'
            group:
              # Narrow this for large tenants, e.g.
              # filter: securityEnabled eq true and startswith(displayName,'dev-')
              filter: securityEnabled eq true
            schedule:
              frequency:
                minutes: 15
              initialDelay:
                seconds: 15
              timeout:
                minutes: 15
kind: ConfigMap
metadata:
  name: rhdh-app-config
  namespace: rhdh-azure
---
apiVersion: v1
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml

    plugins:
      # Imports Entra ID users and groups into the catalog so that signed-in
      # users resolve to a User entity (required for sign-in and RBAC).
      # Connection settings live in app-config (catalog.providers.microsoftGraphOrg).
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-msgraph-dynamic
        disabled: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: rhdh-azure
  name: rhdh-dynamic-plugins
  namespace: rhdh-azure
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: rhdh-azure
  name: rhdh-postgres
  namespace: rhdh-azure
spec:
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
  selector:
    app.kubernetes.io/name: rhdh-postgres
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: rhdh-azure
  name: rhdh-postgres-hl
  namespace: rhdh-azure
spec:
  clusterIP: None
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rhdh-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: rhdh-azure
  name: rhdh-postgres
  namespace: rhdh-azure
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhdh-postgres
  serviceName: rhdh-postgres-hl
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: rhdh-postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: rhdh-postgres-secret
        - name: POSTGRESQL_PORT_NUMBER
          value: "5432"
        - name: POSTGRESQL_VOLUME_DIR
          value: /var/lib/pgsql/data
        - name: PGDATA
          value: /var/lib/pgsql/data/userdata
        - name: POSTGRESQL_MAX_CONNECTIONS
          value: "200"
        image: registry.redhat.io/rhel9/postgresql-16:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -h 127.0.0.1 -p 5432
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -h 127.0.0.1 -p 5432
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: data
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 256Mi
        name: dshm
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: rhdh.redhat.com/v1alpha4
kind: Backstage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: rhdh-azure
  name: developer-hub-azure
  namespace: rhdh-azure
spec:
  application:
    appConfig:
      configMaps:
      - name: rhdh-app-config
      mountPath: /opt/app-root/src
    dynamicPluginsConfigMapName: rhdh-dynamic-plugins
    extraEnvs:
      secrets:
      - name: rhdh-azure-secrets
      - name: rhdh-postgres-secret
    route:
      enabled: true
      host: rhdhazure.apps.ocprod.303.tube
  database:
    enableLocalDb: false
