app:
  title: Red Hat Developer Hub
  baseUrl: https://rhdhazure.apps.ocprod.303.tube

backend:
  baseUrl: https://rhdhazure.apps.ocprod.303.tube
  cors:
    origin: https://rhdhazure.apps.ocprod.303.tube
  auth:
    externalAccess:
      - type: legacy
        options:
          subject: legacy-default-config
          secret: ${BACKEND_SECRET}
  # Dedicated PostgreSQL (base/postgres). Values come from rhdh-postgres-secret.
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

# ---------------------------------------------------------------------------
# Microsoft Entra ID sign-in
# Redirect URI to register on the Entra app registration:
#   https://rhdhazure.apps.ocprod.303.tube/api/auth/microsoft/handler/frame
# ---------------------------------------------------------------------------
signInPage: microsoft

auth:
  environment: production
  providers:
    microsoft:
      production:
        clientId: ${AZURE_CLIENT_ID}
        clientSecret: ${AZURE_CLIENT_SECRET}
        tenantId: ${AZURE_TENANT_ID}
        domainHint: ${AZURE_TENANT_ID}
        signIn:
          resolvers:
            # Tried in order until one matches a User entity from MS Graph.
            - resolver: userIdMatchingUserEntityAnnotation
            - resolver: emailMatchingUserEntityProfileEmail
            - resolver: emailLocalPartMatchingUserEntityName

# ---------------------------------------------------------------------------
# Entra ID users & groups -> catalog (msgraph dynamic plugin)
# Requires Application permissions on the same app registration:
#   User.Read.All, GroupMember.Read.All (admin consent granted)
# ---------------------------------------------------------------------------
catalog:
  # Which entity kinds may be registered from a location. RHDH's bundled
  # app-config.example.yaml is part of the merged config and sets this to
  # [Component, System, Group, Resource, Location, Template, API] -- omitting
  # Domain and User. Pinned explicitly here so registrations do not depend on
  # a file that ships with the image.
  rules:
    - allow:
        - Component
        - System
        - Domain
        - Resource
        - Location
        - Template
        - API
        - Group
        - User

  providers:
    microsoftGraphOrg:
      providerId:
        target: https://graph.microsoft.com/v1.0
        authority: https://login.microsoftonline.com
        tenantId: ${AZURE_TENANT_ID}
        clientId: ${AZURE_CLIENT_ID}
        clientSecret: ${AZURE_CLIENT_SECRET}
        user:
          filter: accountEnabled eq true and userType eq 'Member'
        group:
          # Narrow this for large tenants, e.g.
          # filter: securityEnabled eq true and startswith(displayName,'dev-')
          filter: securityEnabled eq true
        schedule:
          frequency:
            minutes: 15
          initialDelay:
            seconds: 15
          timeout:
            minutes: 15

# ---------------------------------------------------------------------------
# Azure DevOps (service principal auth)
# Used by the Azure DevOps frontend/backend plugins and the scaffolder actions
# publish:azure and azure:pipeline:*. Backstage gets Entra ID tokens for the
# service principal itself; no PAT is needed.
# The service principal must be added as a user (Basic access) in the Azure
# DevOps organization and granted Contributors + Build Administrators on the
# target project(s).
# ---------------------------------------------------------------------------
integrations:
  azure:
    - host: dev.azure.com
      credentials:
        - clientId: ${AZURE_DEVOPS_CLIENT_ID}
          clientSecret: ${AZURE_DEVOPS_CLIENT_SECRET}
          tenantId: ${AZURE_TENANT_ID}

azureDevOps:
  host: dev.azure.com
  organization: ${AZURE_DEVOPS_ORG}

# ---------------------------------------------------------------------------
# Kubernetes — the OpenShift cluster this instance runs on
#
# authProvider: serviceAccount with no serviceAccountToken puts the backend in
# in-cluster mode: it takes the API server address and CA from the pod
# environment and re-reads the projected token
# (/var/run/secrets/kubernetes.io/serviceaccount/token) on every request, so
# nothing expires. The pod gets that token because the Backstage CR runs it as
# the rhdh-kubernetes ServiceAccount with automountServiceAccountToken: true;
# permissions come from the rhdh-kubernetes-reader ClusterRole
# (base/rhdh/kubernetes-rbac.yaml).
#
# `url` and `caFile` below are what in-cluster mode derives anyway; they are
# kept explicit because the config schema requires a url, and they are what a
# non-in-cluster setup would need.
#
# A Component only shows the Kubernetes tab once it carries
#   metadata.annotations:
#     backstage.io/kubernetes-id: <value of the backstage.io/kubernetes-id label
#                                 on its workloads>
# or backstage.io/kubernetes-namespace / backstage.io/kubernetes-label-selector.
# ---------------------------------------------------------------------------
kubernetes:
  serviceLocatorMethod:
    # Query every configured cluster and filter by the entity's annotations.
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: ocprod
          title: OpenShift (ocprod)
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          # Needs metrics.k8s.io read access (granted); set true to skip.
          skipMetricsLookup: false
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # "Open dashboard" links on the Kubernetes tab point at the console.
          dashboardApp: openshift
          dashboardUrl: https://console-openshift-console.apps.ocprod.303.tube
