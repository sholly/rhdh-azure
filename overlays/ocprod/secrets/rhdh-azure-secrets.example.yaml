# TEMPLATE ONLY - do not commit real values.
# Copy to rhdh-azure-secrets.yaml (git-ignored) and apply with `oc apply -f`,
# or convert to a SealedSecret / ExternalSecret.
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-azure-secrets
  namespace: rhdh-azure
type: Opaque
stringData:
  # openssl rand -base64 32
  BACKEND_SECRET: "<random-base64-string>"
  AZURE_TENANT_ID: "<directory-tenant-id-guid>"
  AZURE_CLIENT_ID: "<application-client-id-guid>"
  AZURE_CLIENT_SECRET: "<client-secret-value>"
  # Azure DevOps service principal (app registration added as a user in the
  # Azure DevOps org). Can reuse AZURE_CLIENT_ID/SECRET values if you choose.
  AZURE_DEVOPS_CLIENT_ID: "<devops-sp-client-id-guid>"
  AZURE_DEVOPS_CLIENT_SECRET: "<devops-sp-client-secret-value>"
  AZURE_DEVOPS_ORG: "<azure-devops-organization-name>"
